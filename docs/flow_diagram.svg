<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" font-family="DejaVu Sans, Inter, Segoe UI, Arial, sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect width="1600" height="1130" fill="#FBFAF7"/><rect width="1600" height="64" fill="#0F2A3D"/><text x="30" y="41" font-size="25" font-weight="800" fill="#FFFFFF">Sahra Journey Assistant</text><text x="400" y="41" font-size="18" fill="#C8963E">System flow · data feeds · decision rules</text><text x="1570" y="41" font-size="14" fill="#C9D3DB" text-anchor="end">LangGraph · Pydantic · SQLite · Streamlit</text><text x="30" y="95" font-size="14" font-weight="800" letter-spacing="1.5" fill="#C8963E">DATA FEEDS &amp; TRIGGERS</text><rect x="30" y="110" width="270" height="62" rx="10" fill="#FFFFFF" stroke="#9AA7B2" stroke-width="1.6"/><text x="42" y="134" font-size="17" font-weight="700" fill="#0F2A3D">Display system (FIDS)</text><text x="42" y="154" font-size="13.5" fill="#5B6B78">gate · status · boarding · ETD</text><line x1="300" y1="141" x2="355" y2="137" stroke="#9AA7B2" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="184" width="270" height="62" rx="10" fill="#FFFFFF" stroke="#9AA7B2" stroke-width="1.6"/><text x="42" y="208" font-size="17" font-weight="700" fill="#0F2A3D">Airline operations feed</text><text x="42" y="228" font-size="13.5" fill="#5B6B78">same fields, independent source</text><line x1="300" y1="215" x2="355" y2="137" stroke="#9AA7B2" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="258" width="270" height="62" rx="10" fill="#FFFFFF" stroke="#9AA7B2" stroke-width="1.6"/><text x="42" y="282" font-size="17" font-weight="700" fill="#0F2A3D">Queue sensors</text><text x="42" y="302" font-size="13.5" fill="#5B6B78">Passport &amp; Security wait (min)</text><line x1="300" y1="289" x2="355" y2="137" stroke="#9AA7B2" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="332" width="270" height="62" rx="10" fill="#FFFFFF" stroke="#9AA7B2" stroke-width="1.6"/><text x="42" y="356" font-size="17" font-weight="700" fill="#0F2A3D">Traveller question</text><text x="42" y="376" font-size="13.5" fill="#5B6B78">app / WhatsApp chat · EN · AR · HI</text><line x1="300" y1="363" x2="355" y2="137" stroke="#9AA7B2" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="406" width="270" height="62" rx="10" fill="#FFFFFF" stroke="#9AA7B2" stroke-width="1.6"/><text x="42" y="430" font-size="17" font-weight="700" fill="#0F2A3D">Every-minute scheduler</text><text x="42" y="450" font-size="13.5" fill="#5B6B78">proactive journey scan</text><line x1="300" y1="437" x2="355" y2="137" stroke="#9AA7B2" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="480" width="270" height="62" rx="10" fill="#FFFFFF" stroke="#9AA7B2" stroke-width="1.6"/><text x="42" y="504" font-size="17" font-weight="700" fill="#0F2A3D">Staff console</text><text x="42" y="524" font-size="13.5" fill="#5B6B78">approve / reject · close tickets</text><line x1="300" y1="511" x2="355" y2="137" stroke="#9AA7B2" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="560" width="270" height="92" rx="10" fill="#F3EEE4" stroke="#C8963E" stroke-width="1.6"/><text x="42" y="584" font-size="17" font-weight="700" fill="#0F2A3D">Mock reference data</text><text x="42" y="604" font-size="13.5" fill="#5B6B78">terminal walking graph (m)</text><text x="42" y="622" font-size="13.5" fill="#5B6B78">published security &amp; facility info</text><text x="42" y="640" font-size="13.5" fill="#5B6B78">found-items register</text><text x="360" y="95" font-size="14" font-weight="800" letter-spacing="1.5" fill="#C8963E">AUTONOMOUS PIPELINE — one LangGraph run per event</text><rect x="360" y="110" width="860" height="52" rx="10" fill="#FFFFFF" stroke="#0F2A3D" stroke-width="1.6"/><text x="372" y="134" font-size="17" font-weight="700" fill="#0F2A3D">1  Trigger</text><text x="372" y="154" font-size="13.5" fill="#5B6B78">feed update · traveller question · scheduled scan</text><line x1="790.0" y1="162" x2="790.0" y2="178" stroke="#0F2A3D" stroke-width="2" marker-end="url(#a)"/><rect x="360" y="180" width="860" height="62" rx="10" fill="#FFFFFF" stroke="#0F2A3D" stroke-width="1.6"/><text x="372" y="204" font-size="17" font-weight="700" fill="#0F2A3D">2  Validate &amp; sanitise</text><text x="372" y="224" font-size="13.5" fill="#5B6B78">Pydantic schema (gate format, statuses, timezone) · timestamp not in future · prompt-injection / fake-broadcast filter</text><line x1="790.0" y1="242" x2="790.0" y2="258" stroke="#0F2A3D" stroke-width="2" marker-end="url(#a)"/><rect x="360" y="260" width="860" height="62" rx="10" fill="#FFFFFF" stroke="#0F2A3D" stroke-width="1.6"/><text x="372" y="284" font-size="17" font-weight="700" fill="#0F2A3D">3  Coordinator</text><text x="372" y="304" font-size="13.5" fill="#5B6B78">Deterministic router (EN/AR/HI keywords) → worker · optional LLM only for 'unknown' intent, on redacted text</text><line x1="790.0" y1="322" x2="790.0" y2="338" stroke="#0F2A3D" stroke-width="2" marker-end="url(#a)"/><rect x="360" y="340" width="860" height="232" rx="10" fill="#EEF3F7" stroke="#0F2A3D" stroke-width="1.6"/><text x="372" y="364" font-size="17" font-weight="700" fill="#0F2A3D">4  Specialised workers</text><text x="590" y="364" font-size="13.5" fill="#5B6B78">(pure code unless stated)</text><rect x="374" y="378" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#9AA7B2" stroke-width="1.6"/><text x="386" y="402" font-size="15" font-weight="700" fill="#0F2A3D">4a Feed reconciler</text><text x="386" y="422" font-size="12.5" fill="#5B6B78">FIDS vs airline per field</text><text x="386" y="440" font-size="12.5" fill="#5B6B78">→ data state + staff alerts</text><rect x="585" y="378" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#9AA7B2" stroke-width="1.6"/><text x="597" y="402" font-size="15" font-weight="700" fill="#0F2A3D">4b Journey solver</text><text x="597" y="422" font-size="12.5" fill="#5B6B78">Dijkstra walking route</text><text x="597" y="440" font-size="12.5" fill="#5B6B78">+ live queues → leave-by</text><rect x="796" y="378" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#9AA7B2" stroke-width="1.6"/><text x="808" y="402" font-size="15" font-weight="700" fill="#0F2A3D">4c Responder</text><text x="808" y="422" font-size="12.5" fill="#5B6B78">EN / AR / HI templates</text><text x="808" y="440" font-size="12.5" fill="#5B6B78">filled with verified facts</text><rect x="1007" y="378" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#9AA7B2" stroke-width="1.6"/><text x="1019" y="402" font-size="15" font-weight="700" fill="#0F2A3D">4d Human hand-off</text><text x="1019" y="422" font-size="12.5" fill="#5B6B78">medical · wheelchair ·</text><text x="1019" y="440" font-size="12.5" fill="#5B6B78">unanswerable → ticket now</text><rect x="374" y="472" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#9AA7B2" stroke-width="1.6"/><text x="386" y="496" font-size="15" font-weight="700" fill="#0F2A3D">4e Lost &amp; found</text><text x="386" y="516" font-size="12.5" fill="#5B6B78">match found register</text><text x="386" y="534" font-size="12.5" fill="#5B6B78">→ staff verify in person</text><rect x="585" y="472" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#9AA7B2" stroke-width="1.6"/><text x="597" y="496" font-size="15" font-weight="700" fill="#0F2A3D">4f Official info</text><text x="597" y="516" font-size="12.5" fill="#5B6B78">quote published text only</text><text x="597" y="534" font-size="12.5" fill="#5B6B78">visa → official sources</text><rect x="796" y="472" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#9AA7B2" stroke-width="1.6"/><text x="808" y="496" font-size="15" font-weight="700" fill="#0F2A3D">4g Proactive scan</text><text x="808" y="516" font-size="12.5" fill="#5B6B78">who must leave now?</text><text x="808" y="534" font-size="12.5" fill="#5B6B78">nudge + PRM buggy alert</text><text x="1011" y="502" font-size="12.5" fill="#5B6B78">feed events → 4a → 5</text><text x="1011" y="520" font-size="12.5" fill="#5B6B78">questions → 4a/4b/4c</text><text x="1011" y="538" font-size="12.5" fill="#5B6B78">or 4d / 4e / 4f</text><line x1="790.0" y1="572" x2="790.0" y2="588" stroke="#0F2A3D" stroke-width="2" marker-end="url(#a)"/><rect x="360" y="590" width="860" height="56" rx="10" fill="#FFFFFF" stroke="#0F2A3D" stroke-width="1.6"/><text x="372" y="614" font-size="17" font-weight="700" fill="#0F2A3D">5  Remember state</text><text x="372" y="634" font-size="13.5" fill="#5B6B78">Detects gate change · delay ≥ 10 min · cancellation vs last CONFIRMED values · remembers what passengers were told</text><line x1="790.0" y1="646" x2="790.0" y2="662" stroke="#0F2A3D" stroke-width="2" marker-end="url(#a)"/><rect x="360" y="664" width="860" height="62" rx="10" fill="#FFF7E8" stroke="#C8963E" stroke-width="1.6"/><text x="372" y="688" font-size="17" font-weight="700" fill="#0F2A3D">6  Guard — code only, never an LLM</text><text x="372" y="708" font-size="13.5" fill="#5B6B78">Broadcasts &amp; nudges: CONFIRMED facts only · replies: CONFIRMED or named single source · no booking ref / phone in text</text><line x1="660" y1="726" x2="660" y2="750" stroke="#0F2A3D" stroke-width="2" marker-end="url(#a)"/><text x="668" y="744" font-size="12.5" font-weight="700" fill="#0F2A3D">whole flight</text><path d="M 1160 726 L 1160 830" fill="none" stroke="#0F2A3D" stroke-width="2" marker-end="url(#a)"/><text x="930" y="744" font-size="12.5" font-weight="700" fill="#0F2A3D">single reply / nudge → auto-send</text><rect x="360" y="752" width="600" height="60" rx="10" fill="#FCE9E7" stroke="#B42318" stroke-width="1.6"/><text x="372" y="776" font-size="17" font-weight="700" fill="#0F2A3D">7  Staff approval (durable LangGraph interrupt)</text><text x="372" y="796" font-size="13.5" fill="#5B6B78">approve / reject with staff ID · 5-min timeout = NOT sent + duty manager</text><line x1="660" y1="812" x2="660" y2="830" stroke="#0F2A3D" stroke-width="2" marker-end="url(#a)"/><rect x="360" y="832" width="860" height="54" rx="10" fill="#FFFFFF" stroke="#0F2A3D" stroke-width="1.6"/><text x="372" y="856" font-size="17" font-weight="700" fill="#0F2A3D">8  Write gateway</text><text x="372" y="876" font-size="13.5" fill="#5B6B78">Re-reconciles live feeds: if anything changed since the draft → abort · otherwise one atomic outbox write</text><line x1="790.0" y1="886" x2="790.0" y2="900" stroke="#0F2A3D" stroke-width="2" marker-end="url(#a)"/><rect x="360" y="902" width="860" height="40" rx="10" fill="#FFFFFF" stroke="#0F2A3D" stroke-width="1.6"/><text x="372" y="928.0" font-size="15" font-weight="700" fill="#0F2A3D">9  Log &amp; report  →  10  Streamlit dashboard (traveller app · staff console · live log)</text><path d="M 360 226 L 346 226 L 346 700 L 357 700" fill="none" stroke="#B42318" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="1045" y="205" font-size="12.5" font-weight="700" fill="#B42318">blocked → refusal only</text><text x="1262" y="95" font-size="14" font-weight="800" letter-spacing="1.5" fill="#C8963E">OUTCOMES</text><rect x="1262" y="110" width="310" height="54" rx="10" fill="#FFFFFF" stroke="#9AA7B2" stroke-width="1.6"/><text x="1274" y="134" font-size="17" font-weight="700" fill="#0F2A3D">Traveller reply</text><text x="1274" y="154" font-size="13.5" fill="#5B6B78">verified facts, or 'being confirmed'</text><rect x="1262" y="180" width="310" height="54" rx="10" fill="#FFFFFF" stroke="#9AA7B2" stroke-width="1.6"/><text x="1274" y="204" font-size="17" font-weight="700" fill="#0F2A3D">Personal nudge</text><text x="1274" y="224" font-size="13.5" fill="#5B6B78">leave-now / at-risk, one passenger</text><rect x="1262" y="250" width="310" height="72" rx="10" fill="#FFFFFF" stroke="#9AA7B2" stroke-width="1.6"/><text x="1274" y="274" font-size="17" font-weight="700" fill="#0F2A3D">Flight-wide broadcast</text><text x="1274" y="294" font-size="13.5" fill="#5B6B78">only after staff approval</text><text x="1274" y="312" font-size="13.5" fill="#5B6B78">multilingual per passenger</text><text x="1262" y="360" font-size="14" font-weight="800" letter-spacing="1.5" fill="#C8963E">HUMAN HAND-OFFS (tickets)</text><rect x="1262" y="372" width="310" height="34" rx="8" fill="#FFFFFF" stroke="#9AA7B2"/><text x="1274" y="394" font-size="14" font-weight="700" fill="#0F2A3D">Medical + duty manager</text><text x="1560" y="394" font-size="12.5" fill="#B42318" text-anchor="end">URGENT</text><rect x="1262" y="412" width="310" height="34" rx="8" fill="#FFFFFF" stroke="#9AA7B2"/><text x="1274" y="434" font-size="14" font-weight="700" fill="#0F2A3D">PRM assistance team</text><text x="1560" y="434" font-size="12.5" fill="#B42318" text-anchor="end">HIGH</text><rect x="1262" y="452" width="310" height="34" rx="8" fill="#FFFFFF" stroke="#9AA7B2"/><text x="1274" y="474" font-size="14" font-weight="700" fill="#0F2A3D">Ops control</text><text x="1560" y="474" font-size="12.5" fill="#B42318" text-anchor="end">conflict · data gap</text><rect x="1262" y="492" width="310" height="34" rx="8" fill="#FFFFFF" stroke="#9AA7B2"/><text x="1274" y="514" font-size="14" font-weight="700" fill="#0F2A3D">Gate team</text><text x="1560" y="514" font-size="12.5" fill="#B42318" text-anchor="end">at-risk passenger</text><rect x="1262" y="532" width="310" height="34" rx="8" fill="#FFFFFF" stroke="#9AA7B2"/><text x="1274" y="554" font-size="14" font-weight="700" fill="#0F2A3D">Lost &amp; Found</text><text x="1560" y="554" font-size="12.5" fill="#B42318" text-anchor="end">verify ownership</text><rect x="1262" y="572" width="310" height="34" rx="8" fill="#FFFFFF" stroke="#9AA7B2"/><text x="1274" y="594" font-size="14" font-weight="700" fill="#0F2A3D">Info desk</text><text x="1560" y="594" font-size="12.5" fill="#B42318" text-anchor="end">unanswered question</text><rect x="1262" y="612" width="310" height="34" rx="8" fill="#FFFFFF" stroke="#9AA7B2"/><text x="1274" y="634" font-size="14" font-weight="700" fill="#0F2A3D">Duty manager</text><text x="1560" y="634" font-size="12.5" fill="#B42318" text-anchor="end">approval timeout</text><rect x="1262" y="658" width="310" height="72" rx="10" fill="#F3EEE4" stroke="#C8963E" stroke-width="1.6"/><text x="1274" y="682" font-size="17" font-weight="700" fill="#0F2A3D">Audit log &amp; outbox</text><text x="1274" y="702" font-size="13.5" fill="#5B6B78">every feed read, decision, approval,</text><text x="1274" y="720" font-size="13.5" fill="#5B6B78">message — pseudonymous ids only</text><path d="M 1220 859 L 1240 859 L 1240 137 L 1258 137" fill="none" stroke="#0F2A3D" stroke-width="2" marker-end="url(#a)"/><line x1="1240" y1="225" x2="1258" y2="225" stroke="#0F2A3D" stroke-width="2" marker-end="url(#a)"/><line x1="1240" y1="320" x2="1258" y2="320" stroke="#0F2A3D" stroke-width="2" marker-end="url(#a)"/><path d="M 1220 425 L 1222 425 L 1222 388 L 1258 388" fill="none" stroke="#B42318" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><rect x="30" y="962" width="1540" height="150" rx="12" fill="#FFFFFF" stroke="#0F2A3D" stroke-width="1.6"/><text x="48" y="988" font-size="14" font-weight="800" letter-spacing="1.5" fill="#0F2A3D">DECISION RULES — per field, per flight (4a)</text><rect x="48" y="1004" width="132" height="26" rx="13" fill="#1B7F4B"/><text x="114" y="1022" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">CONFIRMED</text><text x="48" y="1052" font-size="13.5" fill="#0F2A3D">both fresh feeds agree</text><text x="48" y="1072" font-size="13.5" font-weight="700" fill="#1B7F4B">→ broadcasts · nudges · replies</text><rect x="353" y="1004" width="132" height="26" rx="13" fill="#2E6FB7"/><text x="419" y="1022" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">SINGLE SOURCE</text><text x="353" y="1052" font-size="13.5" fill="#0F2A3D">only one fresh feed has it</text><text x="353" y="1072" font-size="13.5" font-weight="700" fill="#2E6FB7">→ replies only, source named</text><rect x="658" y="1004" width="132" height="26" rx="13" fill="#B26A00"/><text x="724" y="1022" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">SYNCING</text><text x="658" y="1052" font-size="13.5" fill="#0F2A3D">feeds disagree &lt; 3 min</text><text x="658" y="1072" font-size="13.5" font-weight="700" fill="#B26A00">→ withheld: 'being confirmed'</text><rect x="963" y="1004" width="132" height="26" rx="13" fill="#B42318"/><text x="1029" y="1022" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">CONFLICT</text><text x="963" y="1052" font-size="13.5" fill="#0F2A3D">feeds disagree ≥ 3 min</text><text x="963" y="1072" font-size="13.5" font-weight="700" fill="#B42318">→ withheld + ops ticket</text><rect x="1268" y="1004" width="132" height="26" rx="13" fill="#6B7280"/><text x="1334" y="1022" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">UNKNOWN</text><text x="1268" y="1052" font-size="13.5" fill="#0F2A3D">no fresh value (&gt; 15 min old)</text><text x="1268" y="1072" font-size="13.5" font-weight="700" fill="#6B7280">→ refuse to guess + data-gap ticket</text><text x="48" y="1100" font-size="13" fill="#5B6B78">Thresholds (sahra/config.py): feed stale 15 min · conflict grace 3 min · approval timeout 5 min · arrive 5 min before boarding · nudge 5 min before leave-by · walking 72 / 54 / 36 m·min⁻¹ (standard / family / reduced mobility)</text></svg>